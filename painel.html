<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Barbeiro | Blequistove</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
    body { background-color: #0a0e13; color: #e5dfd3; padding: 20px; }
    
    .login-box { max-width: 400px; margin: 80px auto; background: #121921; padding: 2rem; border-radius: 8px; border: 1px solid #d4af37; text-align: center; }
    .input-field { width: 100%; padding: 12px; margin: 10px 0; background: #0a0e13; border: 1px solid #1e2c3a; color: #fff; border-radius: 4px; outline: none; }
    .input-field:focus { border-color: #d4af37; }
    .btn { background: #d4af37; color: #000; border: none; padding: 12px 20px; font-weight: bold; width: 100%; cursor: pointer; border-radius: 4px; transition: 0.2s; }
    .btn:hover { background: #c59f2e; }
    
    #admin-content { display: none; }
    .kanban-board { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-top: 20px; }
    .kanban-col { background: #121921; border-radius: 8px; padding: 15px; border: 1px solid #1e2c3a; min-height: 500px; }
    .kanban-col h3 { color: #d4af37; font-family: 'Cinzel', serif; margin-bottom: 15px; border-bottom: 1px solid #1e2c3a; padding-bottom: 5px; }
    
    .card { background: #0a0e13; border: 1px solid #1e2c3a; padding: 15px; border-radius: 6px; margin-bottom: 12px; position: relative; }
    .card h4 { color: #fff; font-size: 1.1rem; margin-bottom: 5px; }
    .card p { font-size: 0.85rem; color: #8c9ba5; margin: 4px 0; }
    .card-actions { display: flex; gap: 5px; margin-top: 12px; flex-wrap: wrap; }
    .btn-sm { padding: 6px 10px; font-size: 0.75rem; border: none; border-radius: 3px; cursor: pointer; text-decoration: none; display: inline-block; font-weight: bold; }
    .btn-wsp { background: #25d366; color: #fff; }
    .btn-map { background: #3498db; color: #fff; }
    .btn-next { background: #d4af37; color: #000; }
    .btn-prev { background: #555; color: #fff; }
    .btn-del { background: #e74c3c; color: #fff; }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="login-screen" class="login-box">
    <h2 style="color: #d4af37; font-family: 'Cinzel'; margin-bottom: 20px;">Blequistove Admin</h2>
    <input type="email" id="admin-email" class="input-field" placeholder="E-mail de acesso">
    <input type="password" id="admin-password" class="input-field" placeholder="Sua Senha">
    <button onclick="login()" class="btn">Entrar no Painel</button>
  </div>

  <!-- CONTEÚDO DO PAINEL -->
  <div id="admin-content">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e2c3a; padding-bottom: 15px;">
      <h1 style="color: #d4af37; font-family: 'Cinzel';">Painel de Atendimentos</h1>
      <button onclick="logout()" class="btn" style="width: auto; background: #e74c3c; color: #fff;">Sair</button>
    </div>

    <div class="kanban-board">
      <div class="kanban-col">
        <h3>⏳ Na Fila</h3>
        <div id="col-fila"></div>
      </div>

      <div class="kanban-col">
        <h3>🚗 A Caminho</h3>
        <div id="col-caminho"></div>
      </div>

      <div class="kanban-col">
        <h3>✂️ Atendendo</h3>
        <div id="col-atendendo"></div>
      </div>

      <div class="kanban-col">
        <h3>✅ Concluído</h3>
        <div id="col-concluido"></div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBDdb5b8oIfM3cCx78aiM1Ns1gPR8E0R4Q",
      authDomain: "barbeariablequistove-c0349.firebaseapp.com",
      projectId: "barbeariablequistove-c0349",
      storageBucket: "barbeariablequistove-c0349.firebasestorage.app",
      messagingSenderId: "159742381988",
      appId: "1:159742381988:web:06c2138f7881e75900bb31",
      measurementId: "G-WLSZGB1K1C"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    function login() {
      const email = document.getElementById('admin-email').value;
      const pass = document.getElementById('admin-password').value;
      auth.signInWithEmailAndPassword(email, pass)
        .catch(err => alert("Acesso negado: " + err.message));
    }

    function logout() {
      auth.signOut();
    }

    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('admin-content').style.display = 'block';
        loadBookings();
      } else {
        document.getElementById('login-screen').style.display = 'block';
        document.getElementById('admin-content').style.display = 'none';
      }
    });

    function loadBookings() {
      db.collection('agendamentos').orderBy('createdAt', 'desc')
        .onSnapshot(snapshot => {
          document.getElementById('col-fila').innerHTML = '';
          document.getElementById('col-caminho').innerHTML = '';
          document.getElementById('col-atendendo').innerHTML = '';
          document.getElementById('col-concluido').innerHTML = '';

          snapshot.forEach(doc => {
            const data = doc.data();
            const card = createCard(doc.id, data);
            
            if (data.status === 'fila') document.getElementById('col-fila').appendChild(card);
            if (data.status === 'caminho') document.getElementById('col-caminho').appendChild(card);
            if (data.status === 'atendendo') document.getElementById('col-atendendo').appendChild(card);
            if (data.status === 'concluido') document.getElementById('col-concluido').appendChild(card);
          });
        }, err => {
          console.error("Erro ao carregar agendamentos:", err);
        });
    }

    function formatPhone(phone) {
      if (!phone) return '';
      let clean = phone.replace(/\D/g, '');
      if (!clean.startsWith('55') && clean.length <= 11) {
        clean = '55' + clean;
      }
      return clean;
    }

    function formatDateTime(dtStr) {
      if (!dtStr) return 'Não informada';
      // Converte YYYY-MM-DDTHH:MM para DD/MM/YYYY - HH:MM
      const parts = dtStr.split('T');
      if (parts.length === 2) {
        const dateParts = parts[0].split('-');
        return `${dateParts[2]}/${dateParts[1]}/${dateParts[0]} às ${parts[1]}`;
      }
      return dtStr;
    }

    function createCard(id, data) {
      const div = document.createElement('div');
      div.className = 'card';
      
      const cleanPhone = formatPhone(data.phone);
      const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(data.address)}`;
      const formattedDate = formatDateTime(data.datetime);

      const prevStatus = getPrevStatus(data.status);
      const nextStatus = getNextStatus(data.status);

      div.innerHTML = `
        <h4>${data.name}</h4>
        <p>📍 ${data.address} ${data.location ? `(${data.location})` : ''}</p>
        <p>📅 ${formattedDate}</p>
        <p>✂️ ${data.services ? data.services.join(', ') : 'Serviço'}</p>
        <p>💰 <strong>R$ ${data.total ? data.total.toFixed(2) : '0,00'}</strong></p>
        <div class="card-actions">
          ${cleanPhone ? `<a href="https://wa.me/${cleanPhone}" target="_blank" class="btn-sm btn-wsp">WhatsApp</a>` : ''}
          <a href="${mapUrl}" target="_blank" class="btn-sm btn-map">Mapa</a>
          ${prevStatus ? `<button onclick="updateStatus('${id}', '${prevStatus}')" class="btn-sm btn-prev">◀</button>` : ''}
          ${data.status !== 'concluido' ? `<button onclick="updateStatus('${id}', '${nextStatus}')" class="btn-sm btn-next">Mover ➔</button>` : ''}
          <button onclick="deleteBooking('${id}')" class="btn-sm btn-del" title="Excluir">🗑</button>
        </div>
      `;
      return div;
    }

    function getNextStatus(current) {
      if (current === 'fila') return 'caminho';
      if (current === 'caminho') return 'atendendo';
      if (current === 'atendendo') return 'concluido';
      return 'concluido';
    }

    function getPrevStatus(current) {
      if (current === 'caminho') return 'fila';
      if (current === 'atendendo') return 'caminho';
      if (current === 'concluido') return 'atendendo';
      return null;
    }

    function updateStatus(id, newStatus) {
      db.collection('agendamentos').doc(id).update({ status: newStatus });
    }

    function deleteBooking(id) {
      if (confirm("Tem certeza que deseja excluir este agendamento?")) {
        db.collection('agendamentos').doc(id).delete();
      }
    }
  </script>
</body>
</html>
