<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Barbeiro - Barbearia Blequistove</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Poppins', sans-serif; }
    .gold-gradient { background: linear-gradient(135deg, #f39c12 0%, #d35400 100%); }
    .gold-text { background: linear-gradient(135deg, #f1c40f, #e67e22); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">

  <!-- Tela de Autenticação / Login -->
  <div id="login-modal" class="fixed inset-0 bg-zinc-950 z-50 flex items-center justify-center p-4">
    <div class="bg-zinc-900 border border-zinc-800 p-8 rounded-2xl max-w-sm w-full space-y-5 text-center shadow-2xl">
      <div class="w-16 h-16 rounded-full gold-gradient text-zinc-950 flex items-center justify-center mx-auto text-2xl font-black">
        <i class="fa-solid fa-scissors"></i>
      </div>
      <div>
        <h2 class="font-bold text-xl text-zinc-100">Painel do Barbeiro</h2>
        <p class="text-xs text-zinc-400 mt-1">Insira suas credenciais para gerenciar os agendamentos</p>
      </div>
      
      <form id="login-form" onsubmit="autenticarFirebase(event)" class="space-y-3">
        <input type="email" id="auth-email" placeholder="E-mail cadastrado" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500">
        <input type="password" id="auth-password" placeholder="Palavra-passe" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500">
        
        <button type="submit" class="w-full gold-gradient text-zinc-950 font-bold py-3 rounded-xl hover:brightness-110 transition flex items-center justify-center gap-2 shadow-lg shadow-amber-950/30">
          <i class="fa-solid fa-right-to-bracket"></i> Entrar no Painel
        </button>
      </form>
    </div>
  </div>

  <!-- Header -->
  <header class="border-b border-zinc-800 bg-zinc-900/80 sticky top-0 backdrop-blur-md z-40">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl gold-gradient text-zinc-950 flex items-center justify-center font-bold text-lg">
          <i class="fa-solid fa-user-gear"></i>
        </div>
        <div>
          <h1 class="font-bold text-base leading-tight">Painel de Gestão</h1>
          <p class="text-xs text-zinc-400">Barbearia Blequistove</p>
        </div>
      </div>
      <button onclick="fazerLogout()" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-300 py-2 px-3 rounded-lg flex items-center gap-1.5 transition">
        <i class="fa-solid fa-right-from-bracket"></i> Sair
      </button>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="max-w-6xl mx-auto px-4 py-6 space-y-6">

    <!-- Métricas Gerais -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      <!-- Total A Atender -->
      <div class="bg-zinc-900 border border-amber-500/30 p-4 rounded-2xl flex flex-col justify-between">
        <div class="flex items-center justify-between text-amber-500">
          <span class="text-xs font-semibold uppercase tracking-wider text-amber-400/80">A Atender</span>
          <i class="fa-solid fa-clock text-lg"></i>
        </div>
        <div class="mt-3">
          <span id="metric-pendentes" class="text-3xl font-black text-amber-500">0</span>
          <span class="text-xs text-zinc-500 block mt-0.5">clientes na fila</span>
        </div>
      </div>

      <!-- Total Concluídos -->
      <div class="bg-zinc-900 border border-emerald-500/30 p-4 rounded-2xl flex flex-col justify-between">
        <div class="flex items-center justify-between text-emerald-400">
          <span class="text-xs font-semibold uppercase tracking-wider text-emerald-400/80">Atendidos</span>
          <i class="fa-solid fa-circle-check text-lg"></i>
        </div>
        <div class="mt-3">
          <span id="metric-concluidos" class="text-3xl font-black text-emerald-400">0</span>
          <span class="text-xs text-zinc-500 block mt-0.5">cortes finalizados</span>
        </div>
      </div>

      <!-- Atendimentos Local Fixo -->
      <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-2xl flex flex-col justify-between">
        <div class="flex items-center justify-between text-blue-400">
          <span class="text-xs font-semibold uppercase tracking-wider text-zinc-400">Local Fixo</span>
          <i class="fa-solid fa-store text-lg"></i>
        </div>
        <div class="mt-3">
          <span id="metric-fixo" class="text-3xl font-black text-blue-400">0</span>
          <span class="text-xs text-zinc-500 block mt-0.5">agendamentos na barbearia</span>
        </div>
      </div>

      <!-- Atendimentos Delivery -->
      <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-2xl flex flex-col justify-between">
        <div class="flex items-center justify-between text-purple-400">
          <span class="text-xs font-semibold uppercase tracking-wider text-zinc-400">Delivery VIP</span>
          <i class="fa-solid fa-motorcycle text-lg"></i>
        </div>
        <div class="mt-3">
          <span id="metric-delivery" class="text-3xl font-black text-purple-400">0</span>
          <span class="text-xs text-zinc-500 block mt-0.5">atendimentos em domicílio</span>
        </div>
      </div>
    </div>

    <!-- Barra de Filtros e Categorias -->
    <div class="flex flex-col md:flex-row gap-3 items-stretch md:items-center justify-between bg-zinc-900/60 p-3 rounded-2xl border border-zinc-800">
      
      <!-- Abas de Estado (Pendente / Concluído / Todos) -->
      <div class="flex gap-1.5 bg-zinc-950 p-1 rounded-xl border border-zinc-800/80">
        <button onclick="setFiltroStatus('pendente')" id="tab-pendente" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-amber-500 text-zinc-950 transition">
          <i class="fa-solid fa-clock"></i> A Atender (<span id="cnt-tab-pendente">0</span>)
        </button>
        <button onclick="setFiltroStatus('concluido')" id="tab-concluido" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold text-zinc-400 hover:text-zinc-200 transition">
          <i class="fa-solid fa-check"></i> Atendidos (<span id="cnt-tab-concluido">0</span>)
        </button>
        <button onclick="setFiltroStatus('todos')" id="tab-todos" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold text-zinc-400 hover:text-zinc-200 transition">
          Todos (<span id="cnt-tab-todos">0</span>)
        </button>
      </div>

      <!-- Filtro por Modalidade (Fixo vs Delivery) -->
      <div class="flex gap-1.5 bg-zinc-950 p-1 rounded-xl border border-zinc-800/80">
        <button onclick="setFiltroTipo('todos')" id="ftip-todos" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-zinc-800 text-zinc-100 transition">
          Todas Modalidades
        </button>
        <button onclick="setFiltroTipo('fixo')" id="ftip-fixo" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-zinc-400 hover:text-zinc-200 transition">
          <i class="fa-solid fa-store text-blue-400"></i> Fixo
        </button>
        <button onclick="setFiltroTipo('delivery')" id="ftip-delivery" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-zinc-400 hover:text-zinc-200 transition">
          <i class="fa-solid fa-motorcycle text-amber-500"></i> Delivery
        </button>
      </div>

    </div>

    <!-- Lista de Cards -->
    <div id="cards-container" class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
      <!-- Conteúdo inserido dinamicamente pelo Firebase -->
    </div>

  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBdDb5b8oIfM3cCx78aiM1Ns1gPR8E0R4Q",
      authDomain: "barbeariablequistove-c0349.firebaseapp.com",
      databaseURL: "https://barbeariablequistove-c0349-default-rtdb.firebaseio.com",
      projectId: "barbeariablequistove-c0349",
      storageBucket: "barbeariablequistove-c0349.firebasestorage.app",
      messagingSenderId: "159742381988",
      appId: "1:159742381988:web:6e14d74afa581b9f00bb31",
      measurementId: "G-EL0MYVYHMR"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let agendamentosData = {};
    let filtroStatus = 'pendente'; // 'pendente', 'concluido', 'todos'
    let filtroTipo = 'todos';     // 'todos', 'fixo', 'delivery'

    // Autenticação
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('login-modal').classList.add('hidden');
        carregarDados();
      } else {
        document.getElementById('login-modal').classList.remove('hidden');
      }
    });

    window.autenticarFirebase = function(event) {
      event.preventDefault();
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;

      signInWithEmailAndPassword(auth, email, password)
        .then(() => {
          document.getElementById('login-modal').classList.add('hidden');
        })
        .catch(() => {
          alert("Erro: E-mail ou palavra-passe incorretos.");
        });
    };

    window.fazerLogout = function() {
      signOut(auth);
    };

    function carregarDados() {
      const dbRef = ref(db, 'agendamentos');
      onValue(dbRef, (snapshot) => {
        agendamentosData = snapshot.val() || {};
        renderizarPainel();
      });
    }

    window.setFiltroStatus = function(st) {
      filtroStatus = st;
      ['pendente', 'concluido', 'todos'].forEach(s => {
        const btn = document.getElementById(`tab-${s}`);
        if (s === st) {
          btn.className = "px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-amber-500 text-zinc-950 transition shadow";
        } else {
          btn.className = "px-3.5 py-1.5 rounded-lg text-xs font-semibold text-zinc-400 hover:text-zinc-200 transition";
        }
      });
      renderizarPainel();
    };

    window.setFiltroTipo = function(tp) {
      filtroTipo = tp;
      ['todos', 'fixo', 'delivery'].forEach(t => {
        const btn = document.getElementById(`ftip-${t}`);
        if (t === tp) {
          btn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold bg-zinc-800 text-zinc-100 transition shadow";
        } else {
          btn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold text-zinc-400 hover:text-zinc-200 transition";
        }
      });
      renderizarPainel();
    };

    function renderizarPainel() {
      const container = document.getElementById('cards-container');
      const keys = Object.keys(agendamentosData);

      let countPendentes = 0;
      let countConcluidos = 0;
      let countFixo = 0;
      let countDelivery = 0;

      keys.forEach(k => {
        const item = agendamentosData[k];
        const isConcluido = item.status === 'Concluído';
        
        if (isConcluido) countConcluidos++;
        else countPendentes++;

        if (item.tipo === 'delivery') countDelivery++;
        else countFixo++;
      });

      // Atualizar contadores no topo
      document.getElementById('metric-pendentes').innerText = countPendentes;
      document.getElementById('metric-concluidos').innerText = countConcluidos;
      document.getElementById('metric-fixo').innerText = countFixo;
      document.getElementById('metric-delivery').innerText = countDelivery;

      document.getElementById('cnt-tab-pendente').innerText = countPendentes;
      document.getElementById('cnt-tab-concluido').innerText = countConcluidos;
      document.getElementById('cnt-tab-todos').innerText = keys.length;

      if (keys.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-12 text-center text-zinc-500 space-y-2">
            <i class="fa-regular fa-calendar-xmark text-4xl"></i>
            <p class="text-sm">Nenhum agendamento registado no momento.</p>
          </div>
        `;
        return;
      }

      let html = '';
      keys.reverse().forEach(key => {
        const item = agendamentosData[key];
        const isConcluido = item.status === 'Concluído';
        const isDelivery = item.tipo === 'delivery';

        // Filtragem por Estado
        if (filtroStatus === 'pendente' && isConcluido) return;
        if (filtroStatus === 'concluido' && !isConcluido) return;

        // Filtragem por Tipo
        if (filtroTipo !== 'todos' && item.tipo !== filtroTipo) return;

        html += `
          <div class="bg-zinc-900 border ${isConcluido ? 'border-zinc-800 opacity-75' : 'border-zinc-800 hover:border-zinc-700'} rounded-2xl p-5 space-y-4 flex flex-col justify-between transition">
            
            <div class="space-y-3">
              <!-- Cabeçalho do Card -->
              <div class="flex justify-between items-start gap-2">
                <span class="text-xs font-bold px-2.5 py-1 rounded-md flex items-center gap-1.5 ${isDelivery ? 'bg-amber-500/10 text-amber-500 border border-amber-500/20' : 'bg-blue-500/10 text-blue-400 border border-blue-500/20'}">
                  ${isDelivery ? '<i class="fa-solid fa-motorcycle"></i> DELIVERY VIP' : '<i class="fa-solid fa-store"></i> LOCAL FIXO'}
                </span>

                <span class="text-xs font-semibold px-2.5 py-1 rounded-md ${isConcluido ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'}">
                  ${isConcluido ? '<i class="fa-solid fa-check"></i> Atendido' : '<i class="fa-solid fa-clock"></i> Pendente'}
                </span>
              </div>

              <!-- Informações do Cliente -->
              <div>
                <h3 class="font-bold text-lg text-zinc-100 leading-snug">${item.cliente}</h3>
                <a href="https://wa.me/55${item.telefone.replace(/\D/g,'')}" target="_blank" class="text-xs text-emerald-400 hover:underline inline-flex items-center gap-1.5 mt-1 font-medium">
                  <i class="fa-brands fa-whatsapp text-sm"></i> ${item.telefone}
                </a>
              </div>

              <!-- Detalhes do Serviço -->
              <div class="bg-zinc-950 p-3.5 rounded-xl border border-zinc-800/80 text-xs space-y-2 text-zinc-300">
                <div class="flex justify-between items-center border-b border-zinc-800/80 pb-2">
                  <span class="text-zinc-400"><i class="fa-regular fa-calendar"></i> ${item.data}</span>
                  <span class="font-bold text-amber-500 text-sm"><i class="fa-regular fa-clock"></i> ${item.horario}</span>
                </div>

                <div>
                  <span class="text-zinc-400 block mb-0.5">Serviços:</span>
                  <span class="font-semibold text-zinc-200">${item.servicos}</span>
                </div>

                ${isDelivery ? `
                  <div class="pt-2 border-t border-zinc-800/80 text-amber-400">
                    <span class="block font-semibold"><i class="fa-solid fa-location-dot"></i> Endereço Delivery:</span>
                    <span class="text-zinc-300">${item.endereco} (${item.regiao})</span>
                  </div>
                ` : ''}

                <div class="pt-2 border-t border-zinc-800/80 flex justify-between items-center text-sm">
                  <span class="text-zinc-400">Valor Total:</span>
                  <span class="font-extrabold text-emerald-400">R$ ${parseFloat(item.total).toFixed(2).replace('.', ',')}</span>
                </div>
              </div>
            </div>

            <!-- Ações -->
            <div class="flex gap-2 pt-2 border-t border-zinc-800/80">
              ${!isConcluido ? `
                <button onclick="mudarStatus('${key}', 'Concluído')" class="flex-1 py-2 bg-emerald-600/20 hover:bg-emerald-600 text-emerald-400 hover:text-white rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5">
                  <i class="fa-solid fa-check"></i> Marcar Atendido
                </button>
              ` : `
                <button onclick="mudarStatus('${key}', 'Pendente')" class="flex-1 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-xl text-xs font-semibold transition">
                  Reabrir
                </button>
              `}

              ${isDelivery ? `
                <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.endereco)}" target="_blank" title="Abrir no Google Maps" class="px-3.5 py-2 bg-zinc-800 hover:bg-zinc-700 text-amber-400 rounded-xl text-xs flex items-center justify-center transition">
                  <i class="fa-solid fa-map-location-dot"></i>
                </a>
              ` : ''}

              <button onclick="deletarItem('${key}')" title="Excluir agendamento" class="px-3.5 py-2 bg-red-500/10 hover:bg-red-500 text-red-400 hover:text-white rounded-xl text-xs transition">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>

          </div>
        `;
      });

      container.innerHTML = html || `<p class="col-span-full text-center py-8 text-zinc-500 text-sm">Nenhum agendamento nesta categoria.</p>`;
    }

    window.mudarStatus = function(key, novoStatus) {
      update(ref(db, `agendamentos/${key}`), { status: novoStatus });
    };

    window.deletarItem = function(key) {
      if(confirm("Tem certeza que deseja apagar este agendamento?")) {
        remove(ref(db, `agendamentos/${key}`));
      }
    };
  </script>
</body>
</html>
