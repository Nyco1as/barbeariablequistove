<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Barbeiro - Gestão de Agendamentos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">

  <!-- Tela de Login Segura (Sem dica de PIN visível) -->
  <div id="login-modal" class="fixed inset-0 bg-zinc-950 z-50 flex items-center justify-center p-4">
    <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl max-w-sm w-full space-y-4 text-center">
      <div class="w-12 h-12 rounded-full bg-amber-500/10 text-amber-500 flex items-center justify-center mx-auto text-xl">
        <i class="fa-solid fa-lock"></i>
      </div>
      <div>
        <h2 class="font-bold text-lg">Acesso Restrito</h2>
        <p class="text-xs text-zinc-400">Entre com as suas credenciais do Firebase</p>
      </div>
      
      <form id="login-form" onsubmit="autenticarFirebase(event)" class="space-y-3">
        <input type="email" id="auth-email" placeholder="E-mail" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500">
        <input type="password" id="auth-password" placeholder="Palavra-passe" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500">
        
        <button type="submit" id="btn-login" class="w-full bg-amber-500 text-zinc-950 font-bold py-3 rounded-xl hover:bg-amber-400 transition flex items-center justify-center gap-2">
          <span>Entrar no Painel</span>
        </button>
      </form>
    </div>
  </div>

  <!-- App Header -->
  <header class="border-b border-zinc-800 bg-zinc-900/50 sticky top-0 backdrop-blur-md z-40">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-amber-500 text-zinc-950 flex items-center justify-center font-bold">
          <i class="fa-solid fa-user-gear"></i>
        </div>
        <div>
          <h1 class="font-bold text-base leading-tight">Painel de Gestão</h1>
          <p class="text-xs text-zinc-400">Barbearia Lequistove</p>
        </div>
      </div>
      <button onclick="fazerLogout()" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-300 py-2 px-3 rounded-lg flex items-center gap-1.5 transition">
        <i class="fa-solid fa-right-from-bracket"></i> Sair
      </button>
    </div>
  </header>

  <!-- Painel Principal -->
  <main class="max-w-6xl mx-auto px-4 py-6 space-y-6">

    <!-- Filtros e Contadores -->
    <div class="flex flex-wrap gap-3 items-center justify-between">
      <div class="flex gap-2 bg-zinc-900 p-1.5 rounded-xl border border-zinc-800">
        <button onclick="filtrar('todos')" id="f-todos" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-500 text-zinc-950">Todos</button>
        <button onclick="filtrar('delivery')" id="f-delivery" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-zinc-400 hover:text-zinc-200">Delivery</button>
        <button onclick="filtrar('fixo')" id="f-fixo" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-zinc-400 hover:text-zinc-200">Local Fixo</button>
      </div>

      <div class="text-xs text-zinc-400">
        Agendamentos no banco: <span id="count-total" class="font-bold text-amber-500">0</span>
      </div>
    </div>

    <!-- Lista de Agendamentos -->
    <div id="cards-container" class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
      <!-- Injetado dinamicamente -->
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBdDb5b8oIfM3cCx78aiM1Ns1gPR8E0R4Q",
      authDomain: "barbeariablequistove-c0349.firebaseapp.com",
      databaseURL: "https://barbeariablequistove-c0349-default-rtdb.firebaseio.com",
      projectId: "barbeariablequistove-c0349",
      storageBucket: "barbeariablequistove-c0349.firebasestorage.app",
      messagingSenderId: "159742381988",
      appId: "1:159742381988:web:6e14d74afa581b9f00bb31",
      measurementId: "G-EL0MYVYHMR"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let agendamentosData = {};
    let filtroAtual = 'todos';

    // Verificar se o utilizador já está autenticado
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('login-modal').classList.add('hidden');
        carregarDados();
      } else {
        document.getElementById('login-modal').classList.remove('hidden');
      }
    });

    window.autenticarFirebase = function(event) {
      event.preventDefault();
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;

      signInWithEmailAndPassword(auth, email, password)
        .then(() => {
          document.getElementById('login-modal').classList.add('hidden');
        })
        .catch((error) => {
          alert("Falha na autenticação: E-mail ou palavra-passe incorretos.");
        });
    };

    window.fazerLogout = function() {
      signOut(auth).then(() => {
        document.getElementById('login-modal').classList.remove('hidden');
      });
    };

    function carregarDados() {
      const dbRef = ref(db, 'agendamentos');
      onValue(dbRef, (snapshot) => {
        agendamentosData = snapshot.val() || {};
        renderCards();
      });
    }

    window.filtrar = function(tipo) {
      filtroAtual = tipo;
      ['todos', 'delivery', 'fixo'].forEach(f => {
        const btn = document.getElementById(`f-${f}`);
        if(f === tipo) {
          btn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-500 text-zinc-950";
        } else {
          btn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold text-zinc-400 hover:text-zinc-200";
        }
      });
      renderCards();
    };

    function renderCards() {
      const container = document.getElementById('cards-container');
      const keys = Object.keys(agendamentosData);
      
      document.getElementById('count-total').innerText = keys.length;

      if(keys.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-12 text-center text-zinc-500 space-y-2">
            <i class="fa-regular fa-calendar-xmark text-3xl"></i>
            <p>Nenhum agendamento encontrado no Firebase.</p>
          </div>
        `;
        return;
      }

      let html = '';
      keys.reverse().forEach(key => {
        const item = agendamentosData[key];

        if(filtroAtual !== 'todos' && item.tipo !== filtroAtual) return;

        const isDelivery = item.tipo === 'delivery';

        html += `
          <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 space-y-4 flex flex-col justify-between">
            <div class="space-y-3">
              <div class="flex justify-between items-start">
                <span class="text-xs font-bold px-2.5 py-1 rounded-md ${isDelivery ? 'bg-amber-500/10 text-amber-500 border border-amber-500/20' : 'bg-blue-500/10 text-blue-400 border border-blue-500/20'}">
                  ${isDelivery ? '<i class="fa-solid fa-motorcycle"></i> Delivery VIP' : '<i class="fa-solid fa-store"></i> Local Fixo'}
                </span>
                <span class="text-xs font-semibold px-2 py-1 rounded bg-zinc-800 text-zinc-300">
                  ${item.status || 'Pendente'}
                </span>
              </div>

              <div>
                <h3 class="font-bold text-lg text-zinc-100">${item.cliente}</h3>
                <a href="https://wa.me/55${item.telefone.replace(/\D/g,'')}" target="_blank" class="text-xs text-emerald-400 hover:underline flex items-center gap-1 mt-0.5">
                  <i class="fa-brands fa-whatsapp"></i> ${item.telefone}
                </a>
              </div>

              <div class="bg-zinc-950 p-3 rounded-xl border border-zinc-800/80 text-xs space-y-1 text-zinc-300">
                <div><b>Data:</b> ${item.data} às ${item.horario}</div>
                <div><b>Serviços:</b> ${item.servicos}</div>
                ${isDelivery ? `
                  <div class="pt-1 border-t border-zinc-800 text-amber-400">
                    <b>Endereço:</b> ${item.endereco} (${item.regiao})
                  </div>
                ` : ''}
                <div class="text-sm font-bold text-emerald-400 pt-1">
                  Total: R$ ${parseFloat(item.total).toFixed(2).replace('.', ',')}
                </div>
              </div>
            </div>

            <div class="flex gap-2 pt-2 border-t border-zinc-800">
              <button onclick="mudarStatus('${key}', 'Concluído')" class="flex-1 py-2 bg-emerald-600/20 hover:bg-emerald-600 text-emerald-400 hover:text-white rounded-lg text-xs font-semibold transition">
                Concluir
              </button>
              ${isDelivery ? `
                <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.endereco)}" target="_blank" class="px-3 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 rounded-lg text-xs flex items-center justify-center">
                  <i class="fa-solid fa-map-location-dot"></i>
                </a>
              ` : ''}
              <button onclick="deletarItem('${key}')" class="px-3 py-2 bg-red-500/10 hover:bg-red-500 text-red-400 hover:text-white rounded-lg text-xs transition">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    window.mudarStatus = function(key, novoStatus) {
      update(ref(db, `agendamentos/${key}`), { status: novoStatus });
    };

    window.deletarItem = function(key) {
      if(confirm("Deseja realmente remover este agendamento?")) {
        remove(ref(db, `agendamentos/${key}`));
      }
    };
  </script>
</body>
</html>
