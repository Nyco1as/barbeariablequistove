    };
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let globalTotal = 0;
let selectedServices = [];

function calculateTotal() {
  const locationSelect = document.getElementById('location-select');
  const locationValue = locationSelect.value;
  const checkboxes = document.querySelectorAll('.checkbox-group input[type="checkbox"]:checked');
  const summaryList = document.getElementById('summary-items');
  
  summaryList.innerHTML = '';
  globalTotal = 0;
  selectedServices = [];

  // Taxa de deslocamento por localização
  if (locationValue === 'ararangua_single') {
    globalTotal += 50;
    let li = document.createElement('li');
    li.innerHTML = `\<em>Taxa Araranguá (Individual) - R$ 50,00\</em>`;
    summaryList.appendChild(li);
  } else if (locationValue === 'ararangua_pair') {
    globalTotal += 80;
    let li = document.createElement('li');
    li.innerHTML = `\<em>Taxa Araranguá (Dupla/Combo) - R$ 80,00\</em>`;
    summaryList.appendChild(li);
  }

  // Serviços Selecionados
  checkboxes.forEach(cb => {
    const itemPrice = parseFloat(cb.value);
    const itemName = cb.getAttribute('data-name');
    globalTotal += itemPrice;
    selectedServices.push(itemName);

    let li = document.createElement('li');
    li.innerHTML = `${itemName} - R$ ${itemPrice.toFixed(2)}`;
    summaryList.appendChild(li);
  });

  if (selectedServices.length === 0 && locationValue === 'arroio') {
    summaryList.innerHTML = '\<li>Nenhum serviço selecionado.\</li>';
  }

  document.getElementById('total-price').innerText = `R$ ${globalTotal.toFixed(2)}`;
}

async function submitBooking() {
  const name = document.getElementById('client-name').value;
  const phone = document.getElementById('client-phone').value;
  const address = document.getElementById('client-address').value;
  const datetime = document.getElementById('client-datetime').value;
  const location = document.getElementById('location-select').options[document.getElementById('location-select').selectedIndex].text;

  if (!name || !phone || !address || !datetime) {
    alert("Por favor, preencha todos os campos do formulário (Nome, Telefone, Endereço e Data/Hora).");
    return;
  }

  if (selectedServices.length === 0) {
    alert("Por favor, selecione pelo menos um serviço.");
    return;
  }

  const bookingData = {
    name,
    phone,
    address,
    datetime,
    location,
    services: selectedServices,
    total: globalTotal,
    status: 'fila',
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  try {
    // Regista no Firebase Firestore
    await db.collection('agendamentos').add(bookingData);

    // Monta a mensagem para o WhatsApp com codificação segura de URL
    const textMessage = 
      `Olá! Meu nome é *${name}*.\n\n` +
      `📍 *Endereço:* ${address} (${location})\n` +
      `📅 *Data/Hora:* ${datetime}\n` +
      `✂️️ *Serviços:* ${selectedServices.join(', ')}\n` +
      `💰 *Total:* R$ ${globalTotal.toFixed(2)}`;

    const whatsappUrl = `https://wa.me/5548992071556?text=${encodeURIComponent(textMessage)}`;

    window.open(whatsappUrl, '_blank');
  } catch (error) {
    console.error("Erro ao agendar:", error);
    alert("Ocorreu um erro ao registrar o agendamento. Tente novamente.");
  }
}
