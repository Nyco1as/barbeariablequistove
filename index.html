<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barbearia Blequistove | Agendamento VIP</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
    body { background-color: #0a0e13; color: #e5dfd3; padding: 20px; }
    .container { max-width: 500px; margin: 0 auto; background: #121921; padding: 25px; border-radius: 10px; border: 1px solid #1e2c3a; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h1 { font-family: 'Cinzel', serif; color: #d4af37; text-align: center; margin-bottom: 5px; font-size: 1.8rem; }
    p.subtitle { text-align: center; color: #8c9ba5; font-size: 0.85rem; margin-bottom: 25px; }
    
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; color: #d4af37; font-weight: 600; font-size: 0.9rem; }
    input, select { width: 100%; padding: 12px; background: #0a0e13; border: 1px solid #1e2c3a; color: #fff; border-radius: 6px; outline: none; font-size: 0.95rem; }
    input:focus, select:focus { border-color: #d4af37; }
    
    .services-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .service-item { background: #0a0e13; border: 1px solid #1e2c3a; padding: 10px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
    .service-item input { width: auto; }
    
    .total-box { background: #0a0e13; border: 1px solid #d4af37; padding: 12px; border-radius: 6px; text-align: center; margin: 20px 0; color: #d4af37; font-size: 1.1rem; font-weight: bold; }
    .btn-submit { width: 100%; background: #d4af37; color: #000; border: none; padding: 14px; font-weight: bold; font-size: 1rem; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    .btn-submit:hover { background: #c59f2e; }
  </style>
</head>
<body>

  <div class="container">
    <h1>BLEQUISTOVE</h1>
    <p class="subtitle">Agendamento de Atendimento ao Domicílio</p>

    <form id="booking-form">
      <div class="form-group">
        <label>Seu Nome</label>
        <input type="text" id="name" placeholder="Digite seu nome completo" required>
      </div>

      <div class="form-group">
        <label>WhatsApp</label>
        <input type="tel" id="phone" placeholder="(48) 99999-9999" required>
      </div>

      <div class="form-group">
        <label>Localização / Bairro</label>
        <select id="location" onchange="calculateTotal()" required>
          <option value="Balneário Arroio do Silva (Sem taxa extra)">Balneário Arroio do Silva (Sem taxa extra)</option>
          <option value="Araranguá (+ R$ 10,00)">Araranguá (+ R$ 10,00)</option>
          <option value="Outra Região (+ R$ 20,00)">Outra Região (+ R$ 20,00)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Endereço Completo</label>
        <input type="text" id="address" placeholder="Rua, número, complemento" required>
      </div>

      <div class="form-group">
        <label>Data e Horário</label>
        <input type="datetime-local" id="datetime" required>
      </div>

      <div class="form-group">
        <label>Serviços Desejados</label>
        <div class="services-grid">
          <label class="service-item"><input type="checkbox" value="30" data-name="Corte Masculino" onchange="calculateTotal()"> Corte (R$ 30)</label>
          <label class="service-item"><input type="checkbox" value="20" data-name="Barba Completa" onchange="calculateTotal()"> Barba (R$ 20)</label>
          <label class="service-item"><input type="checkbox" value="10" data-name="Sobrancelha" onchange="calculateTotal()"> Sobrancelha (R$ 10)</label>
          <label class="service-item"><input type="checkbox" value="15" data-name="Depilação Orelha/Naris" onchange="calculateTotal()"> Depilação (R$ 15)</label>
        </div>
      </div>

      <div class="total-box" id="total-display">Total: R$ 0,00</div>

      <button type="submit" class="btn-submit">Confirmar Agendamento</button>
    </form>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBdDb5b8oIfM3cCx78aiM1Ns1gPR8E0R4Q",
      authDomain: "barbeariablequistove-c0349.firebaseapp.com",
      databaseURL: "https://barbeariablequistove-c0349-default-rtdb.firebaseio.com",
      projectId: "barbeariablequistove-c0349",
      storageBucket: "barbeariablequistove-c0349.firebasestorage.app",
      messagingSenderId: "159742381988",
      appId: "1:159742381988:web:6e14d74afa581b9f00bb31",
      measurementId: "G-EL0MYVYHMR"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function calculateTotal() {
      let total = 0;
      const checkboxes = document.querySelectorAll('.service-item input[type="checkbox"]:checked');
      checkboxes.forEach(cb => total += parseFloat(cb.value));

      const location = document.getElementById('location').value;
      if (location.includes('Araranguá')) total += 10;
      if (location.includes('Outra Região')) total += 20;

      document.getElementById('total-display').innerText = `Total: R$ ${total.toFixed(2)}`;
      return total;
    }

    document.getElementById('booking-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const selectedServices = [];
      document.querySelectorAll('.service-item input[type="checkbox"]:checked').forEach(cb => {
        selectedServices.push(cb.getAttribute('data-name'));
      });

      if (selectedServices.length === 0) {
        alert("Por favor, selecione pelo menos um serviço!");
        return;
      }

      const bookingData = {
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
        location: document.getElementById('location').value,
        address: document.getElementById('address').value,
        datetime: document.getElementById('datetime').value,
        services: selectedServices,
        total: calculateTotal(),
        status: 'fila',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      try {
        await db.collection('agendamentos').add(bookingData);
        alert("Agendamento realizado com sucesso!");
        document.getElementById('booking-form').reset();
        calculateTotal();
      } catch (err) {
        console.error("Erro ao agendar:", err);
        alert("Erro ao gravar agendamento. Tente novamente.");
      }
    });
  </script>
</body>
</html>
