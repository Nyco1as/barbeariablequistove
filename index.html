<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barbearia Lequistove - Agendamento & Serviços</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Poppins', sans-serif; }
    .gold-gradient { background: linear-gradient(135deg, #f39c12 0%, #d35400 100%); }
    .gold-text { background: linear-gradient(135deg, #f1c40f, #e67e22); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="border-b border-zinc-800 bg-zinc-900/80 sticky top-0 z-50 backdrop-blur-md">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-full gold-gradient flex items-center justify-center text-zinc-950 font-black text-xl">
          <i class="fa-solid fa-scissors"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight">Barbearia Lequistove</h1>
          <p class="text-xs text-zinc-400">Atendimento Fixo & Delivery VIP</p>
        </div>
      </div>
      <a href="https://wa.me/5548992071556" target="_blank" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 px-3 rounded-lg flex items-center gap-2 transition">
        <i class="fa-brands fa-whatsapp text-sm"></i> WhatsApp
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto px-4 py-8 w-full space-y-8">

    <!-- Modalidade Selector -->
    <div class="bg-zinc-900 p-2 rounded-2xl border border-zinc-800 flex gap-2">
      <button id="btn-fixo" onclick="setModalidade('fixo')" class="flex-1 py-3 px-4 rounded-xl font-bold text-sm transition flex items-center justify-center gap-2 bg-amber-500 text-zinc-950 shadow-lg">
        <i class="fa-solid fa-store"></i> Local Fixo (Arroio do Silva)
      </button>
      <button id="btn-delivery" onclick="setModalidade('delivery')" class="flex-1 py-3 px-4 rounded-xl font-bold text-sm transition flex items-center justify-center gap-2 text-zinc-400 hover:text-zinc-200">
        <i class="fa-solid fa-motorcycle"></i> Atendimento Delivery VIP
      </button>
    </div>

    <!-- Banner Informativo -->
    <div id="info-banner" class="bg-zinc-900/60 border border-zinc-800 p-4 rounded-2xl flex items-start gap-4">
      <div id="info-icon" class="text-amber-500 text-2xl pt-1">
        <i class="fa-solid fa-location-dot"></i>
      </div>
      <div>
        <h3 id="info-title" class="font-bold text-zinc-200">Local Fixo</h3>
        <p id="info-desc" class="text-sm text-zinc-400">Rua Santa Rosa, 857 - Cidade Balneário Arroio do Silva</p>
      </div>
    </div>

    <!-- Tabela de Serviços e Combos -->
    <section>
      <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
        <i class="fa-solid fa-list-check gold-text"></i> Escolha os Serviços
      </h2>
      <div id="services-list" class="grid sm:grid-cols-2 gap-3">
        <!-- Renderizado dinamicamente via JS -->
      </div>
    </section>

    <!-- Formulário de Agendamento -->
    <section class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 space-y-4">
      <h2 class="text-xl font-bold flex items-center gap-2 text-amber-500">
        <i class="fa-solid fa-calendar-check"></i> Dados do Agendamento
      </h2>

      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">Seu Nome *</label>
          <input type="text" id="cli-nome" placeholder="Digite seu nome" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">Telefone / WhatsApp *</label>
          <input type="tel" id="cli-fone" placeholder="(48) 99999-9999" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500">
        </div>
      </div>

      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">Data *</label>
          <input type="date" id="cli-data" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500 text-zinc-100">
        </div>
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">Horário Desejado *</label>
          <input type="time" id="cli-hora" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500 text-zinc-100">
        </div>
      </div>

      <!-- Campos Exclusivos para Delivery -->
      <div id="field-delivery-extra" class="hidden space-y-4 pt-2 border-t border-zinc-800">
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">Região de Atendimento *</label>
          <select id="cli-regiao" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500">
            <option value="Balneário Arroio do Silva">Balneário Arroio do Silva (Sem taxa extra)</option>
            <option value="Araranguá - Individual">Araranguá (Atendimento Individual - R$ 50,00 min)</option>
            <option value="Araranguá - Combo 2 Pessoas">Araranguá (Traga +1 pessoa - R$ 40,00 por corte)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">Endereço Completo de Entrega/Atendimento *</label>
          <input type="text" id="cli-endereco" placeholder="Rua, número, bairro e ponto de referência" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500">
        </div>
      </div>

      <!-- Resumo do Valor Total -->
      <div class="pt-4 border-t border-zinc-800 flex justify-between items-center">
        <div>
          <span class="text-xs text-zinc-400 block">Total Estimado</span>
          <span id="total-val" class="text-2xl font-black text-amber-500">R$ 0,00</span>
        </div>
        <button onclick="finalizarAgendamento()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-3 rounded-xl transition flex items-center gap-2 shadow-lg shadow-emerald-950">
          <i class="fa-brands fa-whatsapp text-lg"></i> Confirmar Agendamento
        </button>
      </div>
    </section>
  </main>

  <footer class="border-t border-zinc-900 bg-zinc-950 py-6 text-center text-xs text-zinc-600">
    <p>© Barbearia Lequistove. Todos os direitos reservados.</p>
  </footer>

  <!-- Firebase Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBdDb5b8oIfM3cCx78aiM1Ns1gPR8E0R4Q",
      authDomain: "barbeariablequistove-c0349.firebaseapp.com",
      databaseURL: "https://barbeariablequistove-c0349-default-rtdb.firebaseio.com",
      projectId: "barbeariablequistove-c0349",
      storageBucket: "barbeariablequistove-c0349.firebasestorage.app",
      messagingSenderId: "159742381988",
      appId: "1:159742381988:web:6e14d74afa581b9f00bb31",
      measurementId: "G-EL0MYVYHMR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Dados das Tabelas das Imagens
    const tabelaFixo = [
      { id: 'f1', nome: 'Corte Normal', preco: 30 },
      { id: 'f2', nome: 'Corte Navalhado', preco: 35 },
      { id: 'f3', nome: 'Barba', preco: 30 },
      { id: 'f4', nome: 'Pezinho', preco: 15 },
      { id: 'f5', nome: 'Sobrancelha', preco: 15 },
      { id: 'f6', nome: 'Cabelo + Barba', preco: 55 },
      { id: 'f7', nome: 'Depilação Nasal', preco: 20 },
      { id: 'f8', nome: 'Depilação na Orelha', preco: 20 },
      { id: 'f9', nome: 'Combo Nariz + Orelha', preco: 35 }
    ];

    const tabelaDelivery = [
      { id: 'd1', nome: 'Corte Social / Tesoura', preco: 40, desc: 'Acabamento refinado e caimento perfeito' },
      { id: 'd2', nome: 'Corte Navalhado / Fade', preco: 45, desc: 'Degradê de precisão com acabamento na lâmina' },
      { id: 'd3', nome: 'Barba VIP Completa', preco: 35, desc: 'Modelagem, alinhamento e finalização premium' },
      { id: 'd4', nome: 'Pezinho (Acabamento)', preco: 20, desc: 'Contorno preciso para manter o corte em dia' },
      { id: 'd5', nome: 'Sobrancelha Masculina', preco: 20, desc: 'Design natural e alinhamento na navalha' },
      { id: 'd6', nome: 'Depilação Nasal / Orelha', preco: 20, desc: 'Remoção prática e rápida com cera própria (cada)' },
      { id: 'd7', nome: 'Combo Cabelo + Barba', preco: 70, desc: 'Visual completo no seu conforto (Economia R$ 10)' },
      { id: 'd8', nome: 'Combo Higiene (Nariz + Orelha)', preco: 35, desc: 'Cuidado pessoal completo sem complicações' },
      { id: 'd9', nome: 'Combo Família (Pai + Filho)', preco: 75, desc: '2 Cortes no mesmo endereço pelo melhor preço' }
    ];

    let modalidadeAtual = 'fixo';
    let servicosSelecionados = [];

    window.setModalidade = function(tipo) {
      modalidadeAtual = tipo;
      servicosSelecionados = [];
      
      const btnFixo = document.getElementById('btn-fixo');
      const btnDelivery = document.getElementById('btn-delivery');
      const infoBanner = document.getElementById('info-banner');
      const deliveryExtra = document.getElementById('field-delivery-extra');

      if(tipo === 'fixo') {
        btnFixo.className = "flex-1 py-3 px-4 rounded-xl font-bold text-sm transition flex items-center justify-center gap-2 bg-amber-500 text-zinc-950 shadow-lg";
        btnDelivery.className = "flex-1 py-3 px-4 rounded-xl font-bold text-sm transition flex items-center justify-center gap-2 text-zinc-400 hover:text-zinc-200";
        
        infoBanner.innerHTML = `
          <div class="text-amber-500 text-2xl pt-1"><i class="fa-solid fa-location-dot"></i></div>
          <div>
            <h3 class="font-bold text-zinc-200">Local Fixo</h3>
            <p class="text-sm text-zinc-400">Rua Santa Rosa, 857 - Cidade Balneário Arroio do Silva</p>
          </div>
        `;
        deliveryExtra.classList.add('hidden');
      } else {
        btnDelivery.className = "flex-1 py-3 px-4 rounded-xl font-bold text-sm transition flex items-center justify-center gap-2 bg-amber-500 text-zinc-950 shadow-lg";
        btnFixo.className = "flex-1 py-3 px-4 rounded-xl font-bold text-sm transition flex items-center justify-center gap-2 text-zinc-400 hover:text-zinc-200";
        
        infoBanner.innerHTML = `
          <div class="text-amber-500 text-2xl pt-1"><i class="fa-solid fa-wind"></i></div>
          <div>
            <h3 class="font-bold text-zinc-200">A EXPERIÊNCIA VIP NA SUA CASA</h3>
            <p class="text-xs text-zinc-400 mt-1">Sem filas • Sem trânsito • Conforto total e ZERO sujeira (Atendimento finalizado com <b>ASPIRADOR DE PÓ PRÓPRIO</b>).</p>
          </div>
        `;
        deliveryExtra.classList.remove('hidden');
      }

      renderServicos();
      updateTotal();
    };

    function renderServicos() {
      const container = document.getElementById('services-list');
      const lista = modalidadeAtual === 'fixo' ? tabelaFixo : tabelaDelivery;
      
      container.innerHTML = lista.map(s => `
        <label class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl flex items-start gap-3 cursor-pointer hover:border-zinc-700 transition">
          <input type="checkbox" value="${s.id}" onchange="toggleServico('${s.id}')" class="mt-1 w-4 h-4 accent-amber-500 rounded">
          <div class="flex-1">
            <div class="flex justify-between items-center">
              <span class="font-semibold text-sm text-zinc-200">${s.nome}</span>
              <span class="font-bold text-amber-500 text-sm">R$ ${s.preco.toFixed(2).replace('.', ',')}</span>
            </div>
            ${s.desc ? `<p class="text-xs text-zinc-500 mt-0.5">${s.desc}</p>` : ''}
          </div>
        </label>
      `).join('');
    }

    window.toggleServico = function(id) {
      const idx = servicosSelecionados.indexOf(id);
      if(idx > -1) {
        servicosSelecionados.splice(idx, 1);
      } else {
        servicosSelecionados.push(id);
      }
      updateTotal();
    };

    function updateTotal() {
      const lista = modalidadeAtual === 'fixo' ? tabelaFixo : tabelaDelivery;
      const total = servicosSelecionados.reduce((acc, id) => {
        const item = lista.find(s => s.id === id);
        return acc + (item ? item.preco : 0);
      }, 0);

      document.getElementById('total-val').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
    }

    window.finalizarAgendamento = function() {
      const nome = document.getElementById('cli-nome').value.trim();
      const fone = document.getElementById('cli-fone').value.trim();
      const data = document.getElementById('cli-data').value;
      const hora = document.getElementById('cli-hora').value;

      if(!nome || !fone || !data || !hora) {
        alert("Por favor, preencha todos os campos obrigatórios (Nome, Telefone, Data e Horário).");
        return;
      }

      if(servicosSelecionados.length === 0) {
        alert("Selecione pelo menos um serviço.");
        return;
      }

      const lista = modalidadeAtual === 'fixo' ? tabelaFixo : tabelaDelivery;
      const itensEscolhidos = servicosSelecionados.map(id => lista.find(s => s.id === id));
      const total = itensEscolhidos.reduce((acc, i) => acc + i.preco, 0);

      let dadosAgendamento = {
        cliente: nome,
        telefone: fone,
        data: data,
        horario: hora,
        tipo: modalidadeAtual,
        servicos: itensEscolhidos.map(i => i.nome).join(', '),
        total: total,
        status: 'Pendente',
        criadoEm: new Date().toISOString()
      };

      if(modalidadeAtual === 'delivery') {
        const regiao = document.getElementById('cli-regiao').value;
        const endereco = document.getElementById('cli-endereco').value.trim();
        if(!endereco) {
          alert("Por favor, informe o endereço para atendimento delivery.");
          return;
        }
        dadosAgendamento.regiao = regiao;
        dadosAgendamento.endereco = endereco;
      }

      // Enviar ao Firebase
      push(ref(db, 'agendamentos'), dadosAgendamento).then(() => {
        // Formatar mensagem para o WhatsApp
        let msg = `*NOVO AGENDAMENTO - BARBEARIA LEQUISTOVE*\n\n`;
        msg += `👤 *Cliente:* ${nome}\n`;
        msg += `📞 *Contato:* ${fone}\n`;
        msg += `📅 *Data:* ${data} às ${hora}\n`;
        msg += `💈 *Tipo:* ${modalidadeAtual === 'fixo' ? 'Local Fixo (Rua Santa Rosa, 857)' : 'Delivery VIP'}\n`;
        if(modalidadeAtual === 'delivery') {
          msg += `📍 *Região:* ${dadosAgendamento.regiao}\n`;
          msg += `🏠 *Endereço:* ${dadosAgendamento.endereco}\n`;
        }
        msg += `✂️ *Serviços:* ${dadosAgendamento.servicos}\n`;
        msg += `💰 *Total Estimado:* R$ ${total.toFixed(2).replace('.', ',')}`;

        const urlWhats = `https://wa.me/5548992071556?text=${encodeURIComponent(msg)}`;
        window.open(urlWhats, '_blank');
      }).catch(err => {
        alert("Erro ao gravar agendamento: " + err.message);
      });
    };

    // Inicialização
    renderServicos();
  </script>
</body>
</html>
